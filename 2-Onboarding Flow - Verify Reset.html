<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        window.FontAwesomeConfig = { autoReplaceSvg: 'nest' };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Reset Code</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#0A0A0A',
                            card: '#1C1C1C',
                            input: '#2A2A2A',
                            gold: '#C8A84B',
                            primary: '#D4D0C8',
                            secondary: '#9A9690',
                            border: '#787570',
                            error: '#E8533A',
                            success: '#4CAF50'
                        }
                    },
                    fontFamily: {
                        heading: ['"Bebas Neue"', 'sans-serif'],
                        body: ['"DM Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0A0A0A;
            color: #D4D0C8;
            font-family: 'DM Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, h5, h6, .font-heading {
            font-family: 'Bebas Neue', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        ::-webkit-scrollbar { display: none; }

        .code-input {
            width: 48px;
            height: 56px;
            text-align: center;
            font-size: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            background-color: #2A2A2A;
            border: 2px solid transparent;
            border-radius: 8px;
            color: #D4D0C8;
            outline: none;
            transition: all 0.2s;
        }

        .code-input:focus {
            border-color: #C8A84B;
            background-color: #353535;
        }

        .code-input.filled {
            border-color: #C8A84B;
            background-color: #353535;
        }

        .code-input.error {
            border-color: #E8533A;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        @media (max-width: 375px) {
            .code-input {
                width: 44px;
                height: 52px;
                font-size: 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="shared/theme.css">
</head>

<body class="w-full min-h-screen bg-brand-bg text-brand-primary m-0 p-0 overflow-x-hidden">
    <main id="verify-code-screen" class="w-full max-w-[480px] mx-auto min-h-screen flex flex-col px-6 py-12">
        <div class="flex items-center mb-12 pt-4">
            <button onclick="navBack()" class="text-brand-primary hover:text-brand-gold transition-colors">
                <i class="fa-solid fa-arrow-left text-xl"></i>
            </button>
            <h1 class="text-3xl font-heading mx-auto pr-6">Verify Code</h1>
        </div>
        
        <div class="space-y-6 flex-1">
            <div class="bg-brand-card rounded-lg p-6 border border-brand-border border-opacity-30 mb-8">
                <div class="flex items-start gap-4">
                    <div class="w-12 h-12 rounded-full bg-brand-gold bg-opacity-10 flex items-center justify-center flex-shrink-0">
                        <i class="fa-solid fa-envelope-circle-check text-brand-gold text-xl"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-heading text-brand-gold mb-2">Check Your Email</h2>
                        <p class="text-sm text-brand-secondary leading-relaxed mb-3">We sent a 6-digit verification code to <span id="user-email" class="text-brand-primary font-medium">athlete@example.com</span></p>
                        <button onclick="showChangeEmail()" class="text-xs text-brand-gold hover:underline transition-all">
                            <i class="fa-solid fa-pen-to-square mr-1"></i>Change Email
                        </button>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <label class="text-[11px] uppercase text-brand-gold font-bold tracking-wider block text-center">Enter 6-Digit Code</label>
                <div id="code-inputs" class="flex justify-center gap-2 sm:gap-3">
                    <input type="text" maxlength="1" class="code-input" id="code-1" oninput="handleInput(1)" onkeydown="handleKeyDown(event, 1)" autocomplete="off">
                    <input type="text" maxlength="1" class="code-input" id="code-2" oninput="handleInput(2)" onkeydown="handleKeyDown(event, 2)" autocomplete="off">
                    <input type="text" maxlength="1" class="code-input" id="code-3" oninput="handleInput(3)" onkeydown="handleKeyDown(event, 3)" autocomplete="off">
                    <input type="text" maxlength="1" class="code-input" id="code-4" oninput="handleInput(4)" onkeydown="handleKeyDown(event, 4)" autocomplete="off">
                    <input type="text" maxlength="1" class="code-input" id="code-5" oninput="handleInput(5)" onkeydown="handleKeyDown(event, 5)" autocomplete="off">
                    <input type="text" maxlength="1" class="code-input" id="code-6" oninput="handleInput(6)" onkeydown="handleKeyDown(event, 6)" autocomplete="off">
                </div>
                <p id="code-error" class="text-brand-error text-xs text-center opacity-0 transition-opacity">Invalid code. Please try again.</p>
            </div>

            <div id="resend-section" class="text-center py-4">
                <p class="text-brand-secondary text-sm mb-3">Didn't receive the code?</p>
                <button id="resend-btn" onclick="handleResend()" class="text-brand-gold hover:underline transition-all font-medium">
                    <i class="fa-solid fa-rotate-right mr-2"></i>Resend Code
                </button>
                <p id="timer-text" class="text-brand-secondary text-xs mt-2 opacity-0">Resend available in <span id="timer-count">60</span>s</p>
            </div>
            
            <button 
                id="verify-btn" 
                onclick="handleVerify()" 
                disabled
                class="w-full py-4 bg-brand-gold text-brand-bg rounded-lg font-heading text-xl tracking-wider hover:bg-opacity-90 transition-all mt-8 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                Verify & Continue
            </button>

            <div id="success-message" class="bg-brand-gold bg-opacity-10 border border-brand-gold rounded-lg p-4 mt-6 opacity-0 transition-opacity pointer-events-none">
                <div class="flex items-start gap-3">
                    <i class="fa-solid fa-circle-check text-brand-gold text-xl mt-0.5"></i>
                    <div>
                        <p class="text-brand-gold font-medium mb-1">Code Verified!</p>
                        <p class="text-sm text-brand-secondary">Redirecting to password reset...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-auto pt-8">
            <p class="text-brand-secondary">Need help? 
                <button onclick="contactSupport()" class="text-brand-gold hover:underline transition-all">Contact Support</button>
            </p>
        </div>
    </main>

    <div id="change-email-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center px-6 opacity-0 pointer-events-none transition-opacity z-50">
        <div class="bg-brand-card rounded-lg p-6 max-w-md w-full border border-brand-border">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-heading text-brand-gold">Change Email</h3>
                <button onclick="hideChangeEmail()" class="text-brand-secondary hover:text-brand-primary transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-[11px] uppercase text-brand-gold font-bold tracking-wider">New Email Address</label>
                    <input 
                        type="email" 
                        id="new-email-input" 
                        placeholder="newemail@example.com" 
                        class="w-full bg-brand-input rounded-lg p-4 mt-2 outline-none text-brand-primary placeholder-brand-secondary border border-transparent focus:border-brand-gold transition-colors"
                    >
                </div>
                <button onclick="submitNewEmail()" class="w-full py-3 bg-brand-gold text-brand-bg rounded-lg font-heading text-lg tracking-wider hover:bg-opacity-90 transition-all">
                    Send New Code
                </button>
            </div>
        </div>
    </div>

    <script>
        let timerInterval;
        let timerCount = 60;

        function handleInput(position) {
            const input = document.getElementById(`code-${position}`);
            const value = input.value;
            
            if (value.length === 1 && /^[0-9]$/.test(value)) {
                input.classList.add('filled');
                if (position < 6) {
                    document.getElementById(`code-${position + 1}`).focus();
                }
            } else if (value.length === 0) {
                input.classList.remove('filled');
            } else {
                input.value = '';
            }
            
            checkCodeComplete();
        }

        function handleKeyDown(event, position) {
            const input = document.getElementById(`code-${position}`);
            
            if (event.key === 'Backspace' && input.value === '' && position > 1) {
                document.getElementById(`code-${position - 1}`).focus();
            }
            
            if (event.key === 'ArrowLeft' && position > 1) {
                document.getElementById(`code-${position - 1}`).focus();
            }
            
            if (event.key === 'ArrowRight' && position < 6) {
                document.getElementById(`code-${position + 1}`).focus();
            }
        }

        function checkCodeComplete() {
            let code = '';
            let allFilled = true;
            
            for (let i = 1; i <= 6; i++) {
                const input = document.getElementById(`code-${i}`);
                code += input.value;
                if (input.value === '') allFilled = false;
            }
            
            const verifyBtn = document.getElementById('verify-btn');
            verifyBtn.disabled = !allFilled;
            
            return { code, allFilled };
        }

        function handleVerify() {
            const { code } = checkCodeComplete();
            const verifyBtn = document.getElementById('verify-btn');
            const successMessage = document.getElementById('success-message');
            const codeError = document.getElementById('code-error');
            
            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Verifying...';
            
            setTimeout(() => {
                const isValid = code === '123456';
                
                if (isValid) {
                    codeError.classList.remove('opacity-100');
                    codeError.classList.add('opacity-0');
                    
                    for (let i = 1; i <= 6; i++) {
                        document.getElementById(`code-${i}`).classList.remove('error');
                    }
                    
                    successMessage.classList.remove('opacity-0', 'pointer-events-none');
                    successMessage.classList.add('opacity-100');
                    verifyBtn.innerHTML = 'Verified <i class="fa-solid fa-check ml-2"></i>';
                    
                    setTimeout(function () {
                        window.location.href = '5-Onboarding Flow - Create New P.html';
                    }, 800);
                } else {
                    codeError.classList.remove('opacity-0');
                    codeError.classList.add('opacity-100');
                    
                    for (let i = 1; i <= 6; i++) {
                        const input = document.getElementById(`code-${i}`);
                        input.classList.add('error');
                        input.value = '';
                        input.classList.remove('filled');
                    }
                    
                    setTimeout(() => {
                        for (let i = 1; i <= 6; i++) {
                            document.getElementById(`code-${i}`).classList.remove('error');
                        }
                    }, 400);
                    
                    verifyBtn.innerHTML = 'Verify & Continue';
                    verifyBtn.disabled = true;
                    document.getElementById('code-1').focus();
                }
            }, 1200);
        }

        function handleResend() {
            const resendBtn = document.getElementById('resend-btn');
            const timerText = document.getElementById('timer-text');
            
            resendBtn.disabled = true;
            resendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Sending...';
            
            setTimeout(() => {
                resendBtn.innerHTML = '<i class="fa-solid fa-check mr-2"></i>Code Sent';
                
                timerCount = 60;
                timerText.classList.remove('opacity-0');
                timerText.classList.add('opacity-100');
                
                if (timerInterval) clearInterval(timerInterval);
                
                timerInterval = setInterval(() => {
                    timerCount--;
                    document.getElementById('timer-count').textContent = timerCount;
                    
                    if (timerCount <= 0) {
                        clearInterval(timerInterval);
                        resendBtn.disabled = false;
                        resendBtn.innerHTML = '<i class="fa-solid fa-rotate-right mr-2"></i>Resend Code';
                        timerText.classList.remove('opacity-100');
                        timerText.classList.add('opacity-0');
                    }
                }, 1000);
            }, 1000);
        }

        function showChangeEmail() {
            document.getElementById('change-email-modal').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('change-email-modal').classList.add('opacity-100');
        }

        function hideChangeEmail() {
            document.getElementById('change-email-modal').classList.remove('opacity-100');
            document.getElementById('change-email-modal').classList.add('opacity-0', 'pointer-events-none');
        }

        function submitNewEmail() {
            hideChangeEmail();
            const newEmail = document.getElementById('new-email-input').value;
            if (newEmail) {
                document.getElementById('user-email').textContent = newEmail;
            }
            handleResend();
        }

        function navBack() {
            window.location.href = '3-Onboarding Flow - Forgot Passw.html';
        }

        function contactSupport() {
        }

        document.getElementById('code-1').focus();
    </script>
    <script src="shared/demo-shell.js" defer></script>
</body>
</html>
