<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email confirmed — The Dalton Grant Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared/theme.css" />
    <link rel="stylesheet" href="shared/auth-redirect.css" />
    <style>
      body {
        font-family: "DM Sans", sans-serif;
        background: radial-gradient(900px 600px at 20% 0%, rgba(200, 168, 75, 0.15), transparent 55%), var(--demo-bg);
        color: var(--demo-text);
      }
    </style>
  </head>
  <body class="min-h-screen antialiased dalton-marketing">
    <div id="dalton-staggered-menu"></div>
    <main class="mx-auto max-w-xl px-5 pt-20 pb-12">
      <p class="font-bebas text-gold tracking-[0.22em] text-sm">ACCOUNT</p>
      <h1 class="font-bebas text-mist text-4xl mt-2">Verification</h1>

      <div id="pending-state" hidden class="confirm-card mt-8">
        <p class="text-mist text-xl font-bold">Confirm your email</p>
        <p class="text-dim mt-3 leading-relaxed">
          Tap the button below to verify your email address on this device.
        </p>
        <button id="confirm-email-btn" type="button" class="btn-primary">Confirm email address</button>
      </div>

      <div id="success-state" hidden class="confirm-card confirm-card--ok mt-8 auth-success-hero">
        <div class="auth-success-circle" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M20 6L9 17L4 12"
              stroke="#0a0a0a"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <p class="auth-success-title">Account confirmed</p>
        <p class="text-dim mt-3 leading-relaxed text-center">
          Your account creation has been confirmed. Return to The Dalton Grant Academy app, open
          <strong>Create Account</strong>, and tap <strong>I've confirmed — continue</strong>.
        </p>
      </div>

      <div id="error-state" hidden class="confirm-card confirm-card--error mt-8">
        <p id="error-title" class="text-mist text-xl font-bold"></p>
        <p id="error-lead" class="text-dim mt-3 leading-relaxed"></p>
      </div>

      <p class="text-dim text-sm mt-10">
        Need help?
        <a href="/contact-team" class="text-gold hover:underline">Contact the team</a>
      </p>
    </main>
    <script src="shared/dalton-contact-config.js"></script>
    <script src="shared/email-confirmed-config.js"></script>
    <script src="shared/email-confirmed-page.js"></script>
    <script src="shared/marketing-chrome.js"></script>
    <script src="shared/site-footer.js"></script>
  </body>
</html>
