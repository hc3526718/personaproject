<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Basic Info</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0A0A0A',
                        gold: '#D4AF37',
                        gray: {
                            800: '#1F1F1F',
                            900: '#121212'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        bebas: ['"Bebas Neue"', 'cursive']
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            display: none;
        }
        body {
            background-color: #0A0A0A;
            color: white;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .gold-gradient-text {
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .input-field {
            background: #1F1F1F;
            border: 1px solid #2A2A2A;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1);
        }
        .input-field.error {
            border-color: #EF4444;
        }
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
    <link rel="stylesheet" href="shared/theme.css">
</head>
<body class="font-sans antialiased w-full min-h-screen m-0 pb-20">
    <div id="toast" class="toast bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-2 max-w-xs">
        <i class="fa-solid fa-check-circle"></i>
        <span class="text-sm font-medium">Profile updated successfully!</span>
    </div>

    <header id="header" class="w-full px-6 py-4 flex justify-between items-center sticky top-0 bg-dark/90 backdrop-blur-md z-50">
        <button id="back-btn" class="text-gray-400 hover:text-white transition-colors h-11 w-11 flex items-center justify-center rounded-full hover:bg-gray-800">
            <i class="fa-solid fa-arrow-left text-xl"></i>
        </button>
        <h1 class="font-bebas text-xl tracking-wide gold-gradient-text">EDIT BASIC INFO</h1>
        <div class="w-11"></div>
    </header>

    <main id="main" class="w-full max-w-md mx-auto px-4">
        <form id="basic-info-form" class="mt-6 space-y-5">
            <div id="display-name-field">
                <label for="display-name" class="block text-sm font-medium text-gray-300 mb-2">
                    Display Name <span class="text-red-400">*</span>
                </label>
                <input 
                    type="text" 
                    id="display-name" 
                    name="displayName"
                    class="input-field w-full px-4 py-3 rounded-lg text-white text-sm"
                    placeholder="Enter your display name"
                    value="Jordan Smith"
                    required
                >
                <p id="display-name-error" class="text-red-400 text-xs mt-1 hidden">Display name is required</p>
            </div>

            <div id="username-field">
                <label for="username" class="block text-sm font-medium text-gray-300 mb-2">
                    Username/Handle <span class="text-red-400">*</span>
                </label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">@</span>
                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                        class="input-field w-full pl-8 pr-4 py-3 rounded-lg text-white text-sm"
                        placeholder="username"
                        value="jordansmith23"
                        required
                    >
                </div>
                <p id="username-error" class="text-red-400 text-xs mt-1 hidden">Username is required</p>
            </div>

            <div id="bio-field">
                <label for="bio" class="block text-sm font-medium text-gray-300 mb-2">
                    Bio
                </label>
                <textarea 
                    id="bio" 
                    name="bio"
                    rows="4"
                    class="input-field w-full px-4 py-3 rounded-lg text-white text-sm resize-none"
                    placeholder="Tell us about yourself..."
                >Professional basketball player | Nike Athlete | Championship mindset 🏆</textarea>
                <p class="text-xs text-gray-500 mt-1">
                    <span id="bio-count">78</span>/200 characters
                </p>
            </div>

            <div id="location-field">
                <label for="location" class="block text-sm font-medium text-gray-300 mb-2">
                    Location
                </label>
                <div class="relative">
                    <i class="fa-solid fa-location-dot absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                    <input 
                        type="text" 
                        id="location" 
                        name="location"
                        class="input-field w-full pl-10 pr-4 py-3 rounded-lg text-white text-sm"
                        placeholder="City, State/Country"
                        value="Los Angeles, CA"
                    >
                </div>
            </div>

            <div id="sport-role-field">
                <label for="sport-role" class="block text-sm font-medium text-gray-300 mb-2">
                    Primary Sport/Role <span class="text-red-400">*</span>
                </label>
                <div class="relative">
                    <select 
                        id="sport-role" 
                        name="sportRole"
                        class="input-field w-full px-4 py-3 rounded-lg text-white text-sm appearance-none cursor-pointer"
                        required
                    >
                        <option value="">Select your primary sport</option>
                        <option value="basketball" selected>Basketball</option>
                        <option value="football">Football</option>
                        <option value="soccer">Soccer</option>
                        <option value="baseball">Baseball</option>
                        <option value="tennis">Tennis</option>
                        <option value="golf">Golf</option>
                        <option value="track">Track & Field</option>
                        <option value="swimming">Swimming</option>
                        <option value="volleyball">Volleyball</option>
                        <option value="hockey">Hockey</option>
                        <option value="other">Other</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm pointer-events-none"></i>
                </div>
                <p id="sport-role-error" class="text-red-400 text-xs mt-1 hidden">Please select your primary sport</p>
            </div>

            <div id="form-actions" class="pt-6 space-y-3">
                <button 
                    type="submit" 
                    id="save-btn"
                    class="w-full bg-gold hover:bg-gold/90 text-dark font-semibold py-3.5 rounded-lg transition-all shadow-lg shadow-gold/20 hover:shadow-gold/40"
                >
                    Save Changes
                </button>
                <button 
                    type="button" 
                    id="cancel-btn"
                    class="w-full bg-gray-800 hover:bg-gray-700 text-white font-medium py-3.5 rounded-lg transition-colors border border-gray-700"
                >
                    Cancel
                </button>
            </div>
        </form>
    </main>

    <nav id="footer" class="fixed bottom-0 w-full bg-[#141414] border-t border-white/5 px-6 py-4 pb-8 flex justify-between items-center z-50 rounded-t-2xl shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
        <button class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors">
            <i class="fa-solid fa-user-group text-xl mb-1"></i>
            <span class="text-[10px] font-medium">Community</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors">
            <i class="fa-solid fa-play text-xl mb-1"></i>
            <span class="text-[10px] font-medium">Media</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors">
            <i class="fa-solid fa-handshake text-xl mb-1"></i>
            <span class="text-[10px] font-medium">Sponsors</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors">
            <i class="fa-solid fa-calendar-days text-xl mb-1"></i>
            <span class="text-[10px] font-medium">Events</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gold">
            <i class="fa-regular fa-user text-xl mb-1"></i>
            <span class="text-[10px] font-medium">Profile</span>
        </button>
    </nav>

    <script>
        window.addEventListener('load', function() {
            const form = document.getElementById('basic-info-form');
            const displayNameInput = document.getElementById('display-name');
            const usernameInput = document.getElementById('username');
            const bioInput = document.getElementById('bio');
            const sportRoleSelect = document.getElementById('sport-role');
            const bioCount = document.getElementById('bio-count');
            const toast = document.getElementById('toast');
            const backBtn = document.getElementById('back-btn');
            const cancelBtn = document.getElementById('cancel-btn');

            bioInput.addEventListener('input', function() {
                const length = this.value.length;
                bioCount.textContent = Math.min(length, 200);
                if (length > 200) {
                    this.value = this.value.substring(0, 200);
                }
            });

            function showError(inputId, errorId, message) {
                const input = document.getElementById(inputId);
                const error = document.getElementById(errorId);
                input.classList.add('error');
                error.textContent = message;
                error.classList.remove('hidden');
            }

            function clearError(inputId, errorId) {
                const input = document.getElementById(inputId);
                const error = document.getElementById(errorId);
                input.classList.remove('error');
                error.classList.add('hidden');
            }

            displayNameInput.addEventListener('input', function() {
                if (this.value.trim()) {
                    clearError('display-name', 'display-name-error');
                }
            });

            usernameInput.addEventListener('input', function() {
                if (this.value.trim()) {
                    clearError('username', 'username-error');
                }
            });

            sportRoleSelect.addEventListener('change', function() {
                if (this.value) {
                    clearError('sport-role', 'sport-role-error');
                }
            });

            function showToast() {
                toast.classList.add('show');
                setTimeout(function() {
                    toast.classList.remove('show');
                }, 3000);
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                let hasError = false;

                if (!displayNameInput.value.trim()) {
                    showError('display-name', 'display-name-error', 'Display name is required');
                    hasError = true;
                }

                if (!usernameInput.value.trim()) {
                    showError('username', 'username-error', 'Username is required');
                    hasError = true;
                }

                if (!sportRoleSelect.value) {
                    showError('sport-role', 'sport-role-error', 'Please select your primary sport');
                    hasError = true;
                }

                if (!hasError) {
                    showToast();
                    setTimeout(function() {
                    }, 3500);
                }
            });

            backBtn.addEventListener('click', function() {
                window.location.href = '14-Profile Settings - Settings.html';
            });

            cancelBtn.addEventListener('click', function() {
                window.location.href = '14-Profile Settings - Settings.html';
            });
        });
    </script>
    <script src="shared/demo-shell.js" defer></script>
</body>
</html>
