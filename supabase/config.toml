# Supabase CLI — https://supabase.com/docs/guides/cli/config
# Run from repo root: `supabase link` then `supabase functions deploy send-post-report-email`

[functions.send-post-report-email]
# Database webhooks send a JSON body without a user JWT; auth is enforced via `x-report-secret`.
verify_jwt = false

[functions.master-delete-user]
# Validates caller JWT inside the function and requires master PIN + service role for admin.deleteUser.
verify_jwt = false

[functions.revenuecat-webhook]
# RevenueCat sends Authorization header, not a Supabase user JWT.
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.stripe-create-checkout]
verify_jwt = false

[functions.send-contact-email]
# Marketing contact form validates Origin + anon apikey headers inside the function.
verify_jwt = false

[functions.verify-master-pin]
verify_jwt = false

[functions.notify-masters-proposal]
verify_jwt = false

[functions.send-booking-confirmation-email]
# Caller JWT validated inside the function; uses service role to load booking + send Resend.
verify_jwt = false
